# See agent-config.ts's `rules` doc comment for how this file is loaded.
# Same shape as examples/actauth.yml in the actauth package, except each
# rule's `scope` here is only tenant/environment — no agent segment. This
# file only ever governs customer-service (one actauth.yml per agent,
# path derived from the agent's own name), so run-agent.ts appends
# "/customer-service" to every scope below automatically; writing it out
# in each rule would be pure repetition. Rules are matched
# most-specific-scope-first; if nothing matches, default_decision applies.
default_decision: deny

rules:
  # These three don't depend on environment OR tenant — same decision for
  # everyone, everywhere — so both segments are wildcarded rather than
  # repeated per environment/tenant.
  - name: lookup-order-always-allowed
    scope: "*/*"
    tool: lookup_order
    decision: allow

  - name: shipment-details-always-allowed
    scope: "*/*"
    tool: get_shipment_details
    decision: allow

  - name: send-email-always-allowed
    scope: "*/*"
    tool: send_email
    decision: allow

  # issue_refund depends on both dimensions:
  #  - environment: staging never moves real money, so every tenant can
  #    skip the human-in-the-loop step there and let QA iterate without
  #    approving every test run.
  #  - tenant, in production specifically: 'acme-corp' (a caller
  #    presenting the trusted API key — see tenantFor in index.ts) gets
  #    the same auto-allow a trusted, established account might earn in a
  #    real deployment; every other tenant still needs approval, since a
  #    real refund is happening. Same rule set, same agent code — ActAuth's
  #    specificity resolution (exact tenant beats the '*' fallback) is what
  #    actually picks the right one, not a code fork.
  - name: refund-staging-always-allowed
    scope: "*/staging"
    tool: issue_refund
    decision: allow

  - name: refund-acme-corp-production-allowed
    scope: acme-corp/production
    tool: issue_refund
    decision: allow

  - name: refund-production-needs-approval
    scope: "*/production"
    tool: issue_refund
    decision: ask
