services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  agent-api:
    build: .
    ports:
      - '8787:8787'
    environment:
      # redis://redis:6379 is this file's own `redis` service, addressed
      # by its Compose-internal DNS hostname — not a secret, fully
      # determined by the topology right above, so it's the default
      # rather than something that has to come from .env/the shell. The
      # `${VAR:-default}` form still lets it be overridden (e.g. pointing
      # at a real managed Redis instead of the local one this file spins
      # up) without breaking the working-out-of-the-box case when nothing
      # overrides it.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Pulled from a .env file at this project's own root (Compose loads
      # it automatically for ${...} substitution — see README's "Wiring a
      # real model"), or the host shell's environment, or a one-off
      # `docker compose run -e DEEPSEEK_API_KEY=... agent-api`. Left unset
      # (empty string) if none of those provide it — agents/customer-service/
      # index.ts's real createDeepSeekModelCall needs this or every request
      # fails once a real message comes in. ANTHROPIC_API_KEY / OPENAI_API_KEY:
      # only needed if file-agent or rag-agent get wired to a real model
      # call too.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # This service publishes 8787 (see ports: above) — without this,
      # adapters/http.ts logs a startup warning and leaves every route,
      # including the actual approve/deny endpoint
      # (/pending-approvals/:id/resolve), open to anyone who can reach the
      # port, Basic Auth or not. Same ${...}-from-.env-or-shell sourcing as
      # the model keys above.
      LOOPENGINE_ADMIN_AUTH: ${LOOPENGINE_ADMIN_AUTH}
      # This compose file is local/dev-testing (see README's project layout:
      # "Container build + local Redis for testing"), not a real production
      # deployment — staging is the correct default here, not an oversight.
      # A real production deployment (a separate target, per the README's
      # own "Deployment" section) would set LOOPENGINE_ENV: production, or
      # omit it — production is run-agent.ts's own default, the same for
      # every agent (see README's "Multi-tenancy" section).
      LOOPENGINE_ENV: staging
    depends_on:
      - redis
