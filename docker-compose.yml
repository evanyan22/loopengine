services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  agent-api:
    build: .
    ports:
      - '8787:8787'
    environment:
      REDIS_URL: redis://redis:6379
      # DEEPSEEK_API_KEY: agents/customer-service/index.ts's real
      # createDeepSeekModelCall needs this — set here to actually run it
      # through this compose file rather than have every request fail once
      # a real message comes in. ANTHROPIC_API_KEY / OPENAI_API_KEY: only
      # needed if file-agent or rag-agent get wired to a real model call
      # too — see README's "Wiring a real model".
      # This compose file is local/dev-testing (see README's project layout:
      # "Container build + local Redis for testing"), not a real production
      # deployment — staging is the correct default here, not an oversight.
      # A real production deployment (a separate target, per the README's
      # own "Deployment" section) would set LOOPENGINE_ENV: production, or
      # omit it — production is run-agent.ts's own default, the same for
      # every agent (see README's "Multi-tenancy" section).
      LOOPENGINE_ENV: staging
    depends_on:
      - redis
